async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));
  return new TextDecoder().decode(pt);
}

  ev.preventDefault();const pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Checking…';err.textContent='';
  try{const html=await open(pw);try{sessionStorage.setItem('hr-pw',pw)}catch(e){}show(html);}
  catch(e){err.textContent='That password isn\'t right. Try again.';btn.disabled=false;btn.textContent='View page';}
});
</script>
</body>
</html>
